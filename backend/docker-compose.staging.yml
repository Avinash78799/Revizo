services:
  postgres-staging:
    image: pgvector/pgvector:pg16
    container_name: neetpg-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neetpg_staging}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - neetpg_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neetpg_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-staging:
    image: redis:7-alpine
    container_name: neetpg-redis-staging
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - neetpg_staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neetpg-api-staging
    restart: unless-stopped
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-staging:5432/${POSTGRES_DB:-neetpg_staging}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis-staging:6379/0
      SECRET_KEY: ${STAGING_SECRET_KEY}
      ALLOW_MOCK_AI: "false"
      ENFORCE_TWO_PERSON_REVIEW: "true"
      ENFORCE_STRICT_PROVENANCE: "true"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - neetpg_staging_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  neetpg_staging_net:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
