# Production Docker Compose for NEET-PG AI Practice Platform
version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: neetpg-reverse-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - api
    networks:
      - neetpg_prod_public_net
      - neetpg_prod_internal_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neetpg-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-localhost}/api/v1
    networks:
      - neetpg_prod_internal_net
    expose:
      - "3000"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neetpg-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neetpg_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      ALLOW_MOCK_AI: "false"
      ENFORCE_TWO_PERSON_REVIEW: "true"
      ENFORCE_STRICT_PROVENANCE: "true"
    networks:
      - neetpg_prod_internal_net
      - neetpg_prod_db_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: neetpg-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neetpg_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/rls_policies.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
    networks:
      - neetpg_prod_db_net
    # Postgres is strictly isolated inside the private database network, NEVER exposed to public host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neetpg_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neetpg-redis-prod
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - neetpg_prod_db_net
    # Redis is strictly isolated inside the private database network, NEVER exposed to public host
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-worker:
    image: postgres:16-alpine
    container_name: neetpg-backup-worker-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-neetpg_prod}
      BACKUP_KEEP_DAYS: 30
    volumes:
      - ./backups:/backups
    networks:
      - neetpg_prod_db_net
    entrypoint: |
      /bin/sh -c '
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="/backups/neetpg_prod_backup_$${DATE}.sql.gz"
          echo "[Backup] Starting automated database snapshot at $$(date)..."
          pg_dump -U $$PGUSER -d $$PGDATABASE --clean --if-exists --no-owner | gzip > $$BACKUP_FILE
          sha256sum $$BACKUP_FILE > $${BACKUP_FILE}.sha256
          echo "[Backup] Snapshot complete: $$BACKUP_FILE (SHA-256 recorded)"
          # Retain backups for 30 days
          find /backups -name "neetpg_prod_backup_*.sql.gz" -mtime +$$BACKUP_KEEP_DAYS -delete
          # Run every 24 hours (86400 seconds)
          sleep 86400
        done
      '

networks:
  neetpg_prod_public_net:
    driver: bridge
  neetpg_prod_internal_net:
    driver: bridge
  neetpg_prod_db_net:
    internal: true  # Completely private, zero external route

volumes:
  postgres_prod_data:
  redis_prod_data:
